spring.application.name=kjfleets
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
kjfleets.jwt-secret=${JWT_SECRET}
kjfleets.admin-username=${ADMIN_USERNAME:}
kjfleets.admin-password=${ADMIN_PASSWORD:}
kjfleets.routing.mode=${ROUTING_MODE:haversine}
kjfleets.routing.detour-factor=${ROUTING_DETOUR_FACTOR:1.3}
kjfleets.routing.avg-speed-kmh=${ROUTING_AVG_SPEED_KMH:40}
kjfleets.routing.arrival-radius-m=${ROUTING_ARRIVAL_RADIUS_M:200}
kjfleets.routing.position-max-age-s=${ROUTING_POSITION_MAX_AGE_S:300}
kjfleets.dashboard.timezone=${DASHBOARD_TIMEZONE:America/Sao_Paulo}
kjfleets.dashboard.stale-unassigned-min=${DASHBOARD_STALE_UNASSIGNED_MIN:30}
kjfleets.dashboard.stale-assigned-min=${DASHBOARD_STALE_ASSIGNED_MIN:15}
kjfleets.dashboard.stale-dispatched-min=${DASHBOARD_STALE_DISPATCHED_MIN:15}
kjfleets.dashboard.stale-enroute-min=${DASHBOARD_STALE_ENROUTE_MIN:60}
kjfleets.dashboard.stale-arrived-min=${DASHBOARD_STALE_ARRIVED_MIN:20}
kjfleets.dashboard.stale-in-progress-min=${DASHBOARD_STALE_IN_PROGRESS_MIN:90}
kjfleets.dashboard.maintenance-alert-days=${DASHBOARD_MAINTENANCE_ALERT_DAYS:7}
