<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Vehicle studio</title>
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const q = new URLSearchParams(location.search);
const model = q.get("m") || "truck";
const view = q.get("v") || "34";
const W = +(q.get("w") || (view === "side" ? 1800 : 1600));
const H = +(q.get("h") || (view === "side" ? 760 : 1000));
const canvas = document.getElementById("c");
canvas.style.width = `${W / devicePixelRatio}px`;
canvas.style.height = `${H / devicePixelRatio}px`;
document.body.style.overflow = "hidden";

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
function studioEnvironment() {
  const env = new THREE.Scene();
  const geo = new THREE.SphereGeometry(50, 64, 32);
  const colors = [];
  const top = new THREE.Color(0xffffff), horizon = new THREE.Color(0xd4dcd6), floor = new THREE.Color(0x4a524d);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 50;
    const c = y >= 0 ? horizon.clone().lerp(top, Math.pow(y, 0.6)) : horizon.clone().lerp(floor, Math.min(1, -y * 4));
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  env.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const soft = (w, h, x, y, z, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
  };
  soft(30, 8, -10, 30, -12, 3.2);
  soft(14, 22, 30, 10, 18, 1.8);
  soft(18, 6, -30, 8, 10, 1.4);
  return env;
}
scene.environment = pmrem.fromScene(studioEnvironment(), 0.02).texture;
scene.environmentIntensity = 1.05;

const M = {
  paint: new THREE.MeshPhysicalMaterial({ color: 0xeef1ec, roughness: 0.3, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.08 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x34403b, roughness: 0.05, metalness: 1, clearcoat: 1, clearcoatRoughness: 0.02, side: THREE.DoubleSide }),
  trim: new THREE.MeshStandardMaterial({ color: 0x1b211e, roughness: 0.55, metalness: 0.1 }),
  well: new THREE.MeshStandardMaterial({ color: 0x0b0e0d, roughness: 0.95, side: THREE.DoubleSide }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x151816, roughness: 0.82 }),
  rim: new THREE.MeshStandardMaterial({ color: 0xd2d8d4, roughness: 0.22, metalness: 0.92 }),
  hub: new THREE.MeshStandardMaterial({ color: 0x262c29, roughness: 0.45, metalness: 0.5, side: THREE.DoubleSide }),
  lime: new THREE.MeshStandardMaterial({ color: 0x9fe01a, roughness: 0.3, emissive: 0x7fcc10, emissiveIntensity: 0.6, side: THREE.DoubleSide }),
  lamp: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xf6ffe8, emissiveIntensity: 1.4, roughness: 0.15 }),
  tail: new THREE.MeshStandardMaterial({ color: 0x6d1010, emissive: 0xd42a2a, emissiveIntensity: 0.7, roughness: 0.3 })
};

function roundedShape(pts, r) {
  const s = new THREE.Shape();
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
    const rr = p1[2] ?? r;
    const v1 = new THREE.Vector2(p0[0] - p1[0], p0[1] - p1[1]); const l1 = v1.length(); v1.normalize();
    const v2 = new THREE.Vector2(p2[0] - p1[0], p2[1] - p1[1]); const l2 = v2.length(); v2.normalize();
    const d = Math.min(rr, l1 / 2, l2 / 2);
    const a = [p1[0] + v1.x * d, p1[1] + v1.y * d], b = [p1[0] + v2.x * d, p1[1] + v2.y * d];
    if (i === 0) s.moveTo(a[0], a[1]); else s.lineTo(a[0], a[1]);
    if (d > 0) s.quadraticCurveTo(p1[0], p1[1], b[0], b[1]);
  }
  s.closePath();
  return s;
}

function mesh(geo, mat) { const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m; }

function extrudeSide(pts, width, r, bevel, mat) {
  const g = new THREE.ExtrudeGeometry(roundedShape(pts, r), { depth: width - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 8, curveSegments: 24 });
  g.translate(0, 0, -(width - bevel * 2) / 2);
  return mesh(g, mat);
}

function arch(cx, cy, radius, yCut, steps = 18) {
  const a0 = Math.asin(Math.min(1, Math.max(-1, (yCut - cy) / radius)));
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = a0 + (Math.PI - 2 * a0) * (i / steps);
    pts.push([cx + radius * Math.cos(t), cy + radius * Math.sin(t), 0]);
  }
  return pts;
}

function sidePanel(pts, z, r, mat) {
  const g = new THREE.ShapeGeometry(roundedShape(pts, r), 16);
  const m = mesh(g, mat);
  m.position.z = z;
  if (z < 0) m.rotation.y = Math.PI, m.scale.x = -1;
  return m;
}

function slopedPanel(a, b, width, offset, inset, mat, r = 0.08) {
  const d = new THREE.Vector2(b[0] - a[0], b[1] - a[1]);
  const len = d.length(); d.normalize();
  const n = new THREE.Vector2(-d.y, d.x);
  const L = len - inset * 2, Wd = width;
  const g = new THREE.ShapeGeometry(roundedShape([[-L / 2, -Wd / 2], [L / 2, -Wd / 2], [L / 2, Wd / 2], [-L / 2, Wd / 2]], r), 16);
  const m = mesh(g, mat);
  const xAxis = new THREE.Vector3(d.x, d.y, 0), yAxis = new THREE.Vector3(0, 0, -1), zAxis = new THREE.Vector3(n.x, n.y, 0);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis));
  m.position.set((a[0] + b[0]) / 2 + n.x * offset, (a[1] + b[1]) / 2 + n.y * offset, 0);
  return m;
}

function wheel(r, w) {
  const g = new THREE.Group();
  const rIn = r * 0.64;
  const prof = [new THREE.Vector2(rIn, -w / 2)];
  for (let i = 0; i <= 40; i++) {
    const y = -w / 2 + (w * i) / 40;
    const k = Math.pow(1 - Math.pow(Math.abs((2 * y) / w), 6), 1 / 6);
    prof.push(new THREE.Vector2(rIn + (r - rIn) * k, y));
  }
  prof.push(new THREE.Vector2(rIn, w / 2));
  const tire = new THREE.LatheGeometry(prof, 96);
  tire.rotateX(Math.PI / 2);
  g.add(mesh(tire, M.rubber));
  const rimGeo = new THREE.CylinderGeometry(rIn * 1.01, rIn * 1.01, w * 0.86, 64, 1, true);
  rimGeo.rotateX(Math.PI / 2);
  g.add(mesh(rimGeo, M.hub));
  const face = new THREE.Mesh(new THREE.CircleGeometry(rIn * 0.98, 64), M.rim);
  face.position.z = -w * 0.32;
  face.rotation.y = Math.PI;
  g.add(face);
  for (let i = 0; i < 6; i++) {
    const hole = new THREE.Mesh(new THREE.CircleGeometry(rIn * 0.15, 24), M.hub);
    const t = (i / 6) * Math.PI * 2;
    hole.position.set(Math.cos(t) * rIn * 0.58, Math.sin(t) * rIn * 0.58, -w * 0.32 - 0.002);
    hole.rotation.y = Math.PI;
    g.add(hole);
  }
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(rIn * 0.22, rIn * 0.26, 0.05, 32), M.hub);
  cap.rotation.x = Math.PI / 2;
  cap.position.z = -w * 0.32 - 0.02;
  g.add(cap);
  return g;
}

function addWheels(group, xs, r, w, zAbs, y) {
  for (const x of xs) for (const side of [-1, 1]) {
    const wh = wheel(r, w);
    wh.position.set(x, y, side * zAbs);
    if (side > 0) wh.rotation.y = Math.PI;
    group.add(wh);
    const house = new THREE.Mesh(new THREE.CircleGeometry(r * 1.16, 48), M.well);
    house.position.set(x, y, side * (zAbs - w * 0.6));
    group.add(house);
  }
}

function rbox(sx, sy, sz, r, mat, x, y, z = 0) {
  const m = mesh(new RoundedBoxGeometry(sx, sy, sz, 4, r), mat);
  m.position.set(x, y, z);
  return m;
}

function truck() {
  const g = new THREE.Group();
  const Wc = 2.3, wr = 0.5, wy = 0.5, fx = 1.05, rx = 5.7;
  const cabPts = [
    [0, 0.62, 0.12], [-0.02, 1.45, 0.16], [0.4, 2.7, 0.24], [0.66, 2.86, 0.22], [2.05, 2.86, 0.1], [2.05, 0.62, 0.05],
    ...arch(fx, wy, wr + 0.13, 0.62).map(p => [p[0], p[1], 0])
  ];
  g.add(extrudeSide(cabPts, Wc, 0.1, 0.07, M.paint));
  g.add(extrudeSide([[0.8, 2.84, 0.05], [2.04, 3.82, 0.12], [2.04, 2.84, 0.02]], Wc - 0.16, 0.1, 0.05, M.paint));
  g.add(slopedPanel([-0.02, 1.45], [0.4, 2.7], Wc - 0.36, 0.075, 0.13, M.glass));
  for (const z of [Wc / 2 + 0.002, -Wc / 2 - 0.002]) {
    g.add(sidePanel([[0.24, 1.74, 0.06], [0.5, 2.6, 0.12], [1.62, 2.6, 0.1], [1.62, 1.74, 0.06]], z, 0.08, M.glass));
    g.add(sidePanel([[1.74, 0.8, 0], [1.755, 0.8, 0], [1.755, 2.72, 0], [1.74, 2.72, 0]], z * 1.0005, 0, M.trim));
    g.add(sidePanel([[1.42, 1.62, 0.02], [1.6, 1.62, 0.02], [1.6, 1.66, 0.02], [1.42, 1.66, 0.02]], z * 1.0008, 0.02, M.trim));
  }
  g.add(rbox(0.32, 0.46, Wc + 0.08, 0.08, M.trim, 0.02, 0.6));
  g.add(rbox(0.04, 0.38, 1.5, 0.03, M.trim, -0.085, 1.15));
  g.add(rbox(0.03, 0.035, 1.86, 0.012, M.lime, -0.09, 1.4));
  for (const s of [-1, 1]) {
    g.add(rbox(0.04, 0.17, 0.36, 0.05, M.lamp, -0.09, 1.12, s * 0.9));
    g.add(rbox(0.06, 0.05, 0.3, 0.02, M.trim, 0.42, 2.22, s * (Wc / 2 + 0.14)));
    g.add(rbox(0.12, 0.34, 0.06, 0.03, M.trim, 0.42, 2.12, s * (Wc / 2 + 0.3)));
  }
  g.add(rbox(4.9, 2.86, 2.46, 0.09, M.paint, 4.62, 1.08 + 1.43));
  g.add(rbox(4.74, 0.06, 2.47, 0.01, M.lime, 4.62, 1.32));
  g.add(rbox(4.9, 0.47, 1.3, 0.04, M.trim, 4.5, 0.86));
  for (const s of [-1, 1]) {
    g.add(rbox(2.7, 0.38, 0.06, 0.03, M.trim, 3.5, 0.84, s * 1.06));
    g.add(rbox(0.05, 0.22, 0.3, 0.03, M.tail, 7.08, 1.5, s * 1.0));
  }
  g.add(rbox(0.16, 0.24, 2.3, 0.05, M.trim, 7.0, 0.72));
  g.add(rbox(1.5, 0.08, 0.5, 0.03, M.trim, rx, 1.06, 1.06));
  g.add(rbox(1.5, 0.08, 0.5, 0.03, M.trim, rx, 1.06, -1.06));
  addWheels(g, [fx, rx], wr, 0.36, Wc / 2 - 0.15, wy);
  return g;
}

function van() {
  const g = new THREE.Group();
  const Wv = 2.02, wr = 0.38, wy = 0.38, fx = 0.95, rx = 4.35;
  const bottom = 0.44;
  const pts = [
    [0, bottom, 0.12], [-0.04, 0.96, 0.16], [0.1, 1.14, 0.22], [0.9, 1.33, 0.2], [1.64, 2.42, 0.32], [2.0, 2.56, 0.3], [5.28, 2.6, 0.24], [5.46, 2.44, 0.12], [5.46, bottom, 0.06],
    ...arch(rx, wy, wr + 0.1, bottom),
    ...arch(fx, wy, wr + 0.1, bottom)
  ];
  g.add(extrudeSide(pts, Wv, 0.12, 0.1, M.paint));
  g.add(slopedPanel([0.9, 1.33], [1.64, 2.42], Wv - 0.34, 0.105, 0.12, M.glass, 0.1));
  for (const z of [Wv / 2 + 0.002, -Wv / 2 - 0.002]) {
    g.add(sidePanel([[1.16, 1.52, 0.06], [1.66, 2.3, 0.14], [2.34, 2.3, 0.1], [2.34, 1.52, 0.06]], z, 0.08, M.glass));
    g.add(sidePanel([[2.46, 0.62, 0], [2.475, 0.62, 0], [2.475, 2.38, 0], [2.46, 2.38, 0]], z * 1.0005, 0, M.trim));
    g.add(sidePanel([[3.86, 0.62, 0], [3.875, 0.62, 0], [3.875, 2.4, 0], [3.86, 2.4, 0]], z * 1.0005, 0, M.trim));
    g.add(sidePanel([[1.5, 0.74, 0.01], [3.84, 0.74, 0.01], [3.84, 0.8, 0.01], [1.5, 0.8, 0.01]], z * 1.0008, 0.01, M.lime));
    g.add(sidePanel([[2.12, 1.42, 0.02], [2.3, 1.42, 0.02], [2.3, 1.46, 0.02], [2.12, 1.46, 0.02]], z * 1.0008, 0.02, M.trim));
  }
  g.add(rbox(0.34, 0.38, Wv + 0.06, 0.1, M.trim, -0.04, 0.5));
  g.add(rbox(0.05, 0.17, 1.24, 0.03, M.trim, -0.145, 0.8));
  g.add(rbox(0.03, 0.03, 1.56, 0.012, M.lime, -0.155, 0.93));
  for (const s of [-1, 1]) {
    g.add(rbox(0.16, 0.11, 0.44, 0.04, M.lamp, -0.08, 1.02, s * 0.7));
    g.add(rbox(0.1, 0.26, 0.05, 0.03, M.trim, 1.18, 1.82, s * (Wv / 2 + 0.24)));
    g.add(rbox(0.05, 0.04, 0.24, 0.015, M.trim, 1.14, 1.72, s * (Wv / 2 + 0.11)));
    g.add(rbox(0.05, 0.5, 0.14, 0.03, M.tail, 5.5, 1.3, s * 0.88));
  }
  g.add(rbox(0.16, 0.28, Wv + 0.04, 0.06, M.trim, 5.47, 0.5));
  addWheels(g, [fx, rx], wr, 0.27, Wv / 2 - 0.12, wy);
  return g;
}

const vehicle = model === "van" ? van() : truck();
scene.add(vehicle);

const box = new THREE.Box3().setFromObject(vehicle);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());

const blobCanvas = document.createElement("canvas");
blobCanvas.width = blobCanvas.height = 256;
const bctx = blobCanvas.getContext("2d");
const grd = bctx.createRadialGradient(128, 128, 10, 128, 128, 128);
grd.addColorStop(0, "rgba(0,0,0,0.85)"); grd.addColorStop(0.55, "rgba(0,0,0,0.35)"); grd.addColorStop(1, "rgba(0,0,0,0)");
bctx.fillStyle = grd; bctx.fillRect(0, 0, 256, 256);
const blob = new THREE.Mesh(new THREE.PlaneGeometry(size.x * 1.25, size.z * 1.9), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(blobCanvas), transparent: true, depthWrite: false, opacity: 0.55 }));
blob.rotation.x = -Math.PI / 2;
blob.position.set(center.x, 0.003, 0);
scene.add(blob);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.2 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(center.x - 4, 12, 5);
key.target.position.copy(center);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -9;
key.shadow.camera.right = key.shadow.camera.top = 9;
key.shadow.radius = 9;
key.shadow.blurSamples = 24;
key.shadow.bias = -0.0004;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xeaffd6, 0.9);
rim.position.set(center.x + 9, 5, 7);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0x2f3a33, 0.25));

const fov = view === "side" ? 16 : 24;
const camera = new THREE.PerspectiveCamera(fov, W / H, 0.1, 200);
const dir = view === "side" ? new THREE.Vector3(0, 0.07, -1) : new THREE.Vector3(-0.7, 0.22, -0.72);
dir.normalize();
const radius = size.length() / 2;
const dist = (radius / Math.sin(THREE.MathUtils.degToRad(fov) / 2)) * (view === "side" ? 0.78 : 0.86);
const look = center.clone().add(new THREE.Vector3(0, -size.y * 0.06, 0));
camera.position.copy(look).addScaledVector(dir, dist);
camera.lookAt(look);

renderer.render(scene, camera);
window.__ready = true;
</script>
</body>
</html>
